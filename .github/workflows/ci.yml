# Verify the standalone Go SDK generator on pushes and pull requests.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: make build
      - name: Verify
        run: make verify
      - name: Test
        run: make test
      - name: Check that verification leaves the worktree clean
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            printf '%s\n' 'Verification changed tracked files:' "$status" >&2
            exit 1
          fi
